name: Jezicne verzije (i18n)

# Regenerira /en/, /de/, /es/, /it/ iz index.html i locales/.
#
# KAKO RADI:
#   1) extract — hrvatski tekst iz index.html se prepisuje u locales/hr/*.json
#   2) verify  — provjera da HR kroz cijeli lanac daje identican tekst
#   3) build   — gradi jezicne verzije; jezik bez prijevoda se preskace
#
# Izvor istine je index.html. Prijevode uredujes u locales/<jezik>/*.json,
# a mape /en/, /de/, /es/, /it/ se NE uredjuju rucno — ovaj workflow ih
# prepisuje pri svakom pushu.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "locales/**"
      - "tools/i18n.js"
      - ".github/workflows/i18n.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: i18n
  cancel-in-progress: false

jobs:
  build:
    # Bez ovoga bi commit workflowa okinuo novi workflow, u krug.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Osvjezi hrvatske prijevode iz index.html
        run: node tools/i18n.js extract

      - name: Provjeri round-trip (HR mora ostati identican)
        run: node tools/i18n.js verify

      - name: Sagradi jezicne verzije
        run: node tools/i18n.js build

      - name: Stanje prijevoda
        run: node tools/i18n.js status

      - name: Commitaj promjene
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Jezicne verzije nepromijenjene — nema commita."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "i18n: regenerirane jezicne verzije ($(date -u '+%d.%m.%Y %H:%M UTC'))"
          git push
